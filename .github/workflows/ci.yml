name: CI

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 4 * * 3"

permissions:
  contents: write

jobs:
  unit-tests:
    name: PHPUnit tests on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: xdebug
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run coverage report
        run: ./vendor/bin/phpunit --testsuite="Unit"

      - name: Coverage summary
        run: cat coverage.txt >> $GITHUB_STEP_SUMMARY

      - name: Create archive for html coverage
        run: tar -czvf html-coverage.tar.gz html-coverage

      - name: Upload coverage html archive
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage
          overwrite: true
          path: ./html-coverage.tar.gz

      - name: Create coverage badge
        uses: timkrase/phpunit-coverage-badge@v1.2.1
        with:
          report: ./clover-coverage.xml
          coverage_badge_path: phpunit-coverage-badge.svg
          push_badge: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          commit_name: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com

  psalm-security-scan:
    name: Psalm static security analysis on ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Psalm security scan
        uses: docker://ghcr.io/psalm/psalm-github-actions
        with:
          security_analysis: true
          show_info: true
          report_file: results.sarif
        continue-on-error: true

      - name: Upload security analysis results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
